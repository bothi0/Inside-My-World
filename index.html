<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inside My World | عالمي الخاص</title>
    <style>
        :root {
            --main-bg: #f0f9ff;
            --primary-blue: #0ea5e9;
            --soft-green: #dcfce7;
            --text-color: #334155;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--main-bg);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* شاشة تسجيل الدخول */
        #login-screen {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* محتوى الموقع - مخفي قبل الدخول */
        #main-content { display: none; width: 95%; max-width: 800px; margin: 20px auto; }

        header {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border-bottom: 5px solid var(--primary-blue);
            margin-bottom: 20px;
        }

        .notebook-section {
            background: white;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px; /* شكل المذاكرة */
            padding: 20px;
            border-radius: 15px;
            border-left: 10px solid var(--soft-green);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 300px;
        }

        .admin-panel {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px dashed #cbd5e1;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>مرحباً بك</h2>
        <p>أدخل اسمك للدخول إلى عالمي</p>
        <input type="text" id="visitor-name" placeholder="اسمك الكريم...">
        <button onclick="login()">دخول</button>
    </div>

    <div id="main-content">
        <header>
            <h1 id="welcome-msg">Inside My World</h1>
            <p style="color: var(--primary-blue);">أهلاً بك في مذكراتي الخاصة</p>
        </header>

        <div class="notebook-section">
            <h2>📝 الملاحظات والذكريات</h2>
            <div id="notes-area">
                <p>هنا أكتب كل ما يجول في خاطري.. الصور والمقاطع ستظهر هنا.</p>
                <div id="gallery"></div>
            </div>
        </div>

        <div class="admin-panel">
            <button onclick="showAdmin()">إضافة محتوى (لي فقط)</button>
            <div id="admin-tools" class="hidden">
                <input type="password" id="admin-pass" placeholder="كلمة مرور الإدارة">
                <input type="file" id="image-upload" accept="image/*">
                <button onclick="uploadImage()">إضافة الصورة للموقع</button>
            </div>
        </div>
    </div>

    <script>
        function login() {
            let name = document.getElementById('visitor-name').value;
            if(name.trim() !== "") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
                document.getElementById('welcome-msg').innerText = "عالم " + name;
                document.body.style.alignItems = "flex-start";
            } else {
                alert("لطفاً أدخل اسمك أولاً");
            }
        }

        function showAdmin() {
            document.getElementById('admin-tools').classList.toggle('hidden');
        }

        function uploadImage() {
            let pass = document.getElementById('admin-pass').value;
            if(pass === "1234") { // كلمة السر الافتراضية، غيرها كما تحب
                let fileInput = document.getElementById('image-upload');
                if(fileInput.files[0]) {
                    let reader = new FileReader();
                    reader.onload = function(e) {
                        let img = document.createElement('img');
                        img.src = e.target.result;
                        img.style.width = "100%";
                        img.style.marginTop = "20px";
                        img.style.borderRadius = "10px";
                        document.getElementById('gallery').appendChild(img);
                    }
                    reader.readAsDataURL(fileInput.files[0]);
                    alert("تمت إضافة الصورة بنجاح!");
                }
            } else {
                alert("كلمة مرور خاطئة!");
            }
        }
    </script>
</body>
</html>
